name: Validate UV Alert Settings

on:
  workflow_dispatch:

jobs:
  configure:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve timezone and validate settings
        id: config
        env:
          LATITUDE: ${{ vars.LATITUDE }}
          LONGITUDE: ${{ vars.LONGITUDE }}
          NOTIFICATION_HOUR: ${{ vars.NOTIFICATION_HOUR }}
        run: |
          python - <<'PY'
          import json, os, sys, urllib.parse, urllib.request

          def fail(msg):
              print(f"::error::{msg}")
              sys.exit(1)

          coordinates = {
              "LATITUDE": os.environ.get("LATITUDE", "").strip(),
              "LONGITUDE": os.environ.get("LONGITUDE", "").strip(),
          }
          missing = [name for name, value in coordinates.items() if not value]
          if missing:
              fail("Missing GitHub Actions variables: " + ", ".join(missing))

          def parse_coordinate(name):
              value = coordinates[name]
              try:
                  return float(value)
              except ValueError:
                  masked_format = "".join("0" if char.isdigit() else char for char in value)
                  fail(
                      f"{name} must be a decimal number without quotes, labels, or units. "
                      f"Received format: {masked_format!r}"
                  )

          lat = parse_coordinate("LATITUDE")
          lon = parse_coordinate("LONGITUDE")

          if not -90 <= lat <= 90: fail("LATITUDE must be between -90 and 90.")
          if not -180 <= lon <= 180: fail("LONGITUDE must be between -180 and 180.")

          hour = os.environ.get("NOTIFICATION_HOUR", "").strip()
          if not hour.isdigit() or not 0 <= int(hour) <= 23:
              fail("NOTIFICATION_HOUR must be an integer from 0 to 23.")

          query = urllib.parse.urlencode({
              "latitude": lat, "longitude": lon,
              "daily": "uv_index_max", "forecast_days": 1, "timezone": "auto"
          })
          try:
              with urllib.request.urlopen(
                  f"https://api.open-meteo.com/v1/forecast?{query}", timeout=20
              ) as response:
                  payload = json.load(response)
          except Exception as exc:
              fail(f"Timezone lookup failed: {exc}")

          if payload.get("error"):
              fail(payload.get("reason", "Open-Meteo returned an error."))
          timezone = payload.get("timezone")
          if not timezone:
              fail("Open-Meteo did not return a timezone.")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"timezone={timezone}\n")
              out.write(f"hour={int(hour)}\n")
          print(f"Resolved timezone: {timezone}")
          print(f"Notification time: {int(hour):02d}:00 local time")
          PY
